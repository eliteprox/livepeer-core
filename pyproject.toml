[project]
name = "livepeer-builder"
version = "0.1.0"
description = "Enterprise gateway cost sync and usage attribution"
readme = "README.md"
authors = [
    { name = "John | Elite Encoder", email = "john@eliteencoder.net" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "httpx>=0.28.1",
    "pydantic>=2",
]

[build-system]
requires = ["uv_build>=0.8.21,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
proof = [
    "livepeer-gateway",
]

[tool.uv.sources]
livepeer-gateway = { git = "https://github.com/eliteprox/livepeer-python-gateway.git", rev = "3250c08cb6424d339614f1e9095064fbe7e6da6e" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
